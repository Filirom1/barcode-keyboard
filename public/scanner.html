<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Barcode Scanner</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000; color: #fff;
      font-family: system-ui, sans-serif;
      height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── Top status bar ───────────────────────────────────────────────── */
    #topbar {
      background: #0f172a; border-bottom: 1px solid #1e293b;
      padding: 8px 14px; display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: #94a3b8; min-height: 38px; flex-shrink: 0;
    }
    #iroh-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ca8a04; flex-shrink: 0; transition: background 0.4s;
    }
    #iroh-dot.ready  { background: #16a34a; }
    #iroh-dot.error  { background: #dc2626; }
    #iroh-dot.sending { background: #2563eb; }

    /* ── Camera area ──────────────────────────────────────────────────── */
    #wrap { position: relative; flex: 1; overflow: hidden; }
    #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    /* Dark mask with hole */
    #viewfinder {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -56%);
      width: min(82vw, 340px); height: min(30vh, 150px);
      border-radius: 6px; box-shadow: 0 0 0 9999px rgba(0,0,0,.55);
      transition: box-shadow .2s;
    }
    #viewfinder.found {
      box-shadow: 0 0 0 9999px rgba(0,0,0,.55), 0 0 0 3px #4ade80, 0 0 20px 4px rgba(74,222,128,.4);
    }
    #viewfinder::before, #viewfinder::after, #vf-b::before, #vf-b::after {
      content: ''; position: absolute; width: 22px; height: 22px;
      border-color: #4ade80; border-style: solid; border-width: 0;
    }
    #viewfinder::before { top:-2px; left:-2px;   border-top-width:3px;    border-left-width:3px;  border-top-left-radius:4px; }
    #viewfinder::after  { top:-2px; right:-2px;  border-top-width:3px;    border-right-width:3px; border-top-right-radius:4px; }
    #vf-b { position: absolute; inset: 0; }
    #vf-b::before { bottom:-2px; left:-2px;  border-bottom-width:3px; border-left-width:3px;  border-bottom-left-radius:4px; }
    #vf-b::after  { bottom:-2px; right:-2px; border-bottom-width:3px; border-right-width:3px; border-bottom-right-radius:4px; }

    #scan-line {
      position: absolute; left: 6px; right: 6px; height: 2px; border-radius: 1px;
      background: linear-gradient(90deg, transparent 0%, rgba(74,222,128,.6) 20%, #4ade80 50%, rgba(74,222,128,.6) 80%, transparent 100%);
      box-shadow: 0 0 6px 1px rgba(74,222,128,.7);
      animation: sweep 2.4s ease-in-out infinite;
    }
    @keyframes sweep {
      0%   { top: 4px; opacity: 1; }
      48%  { top: calc(100% - 6px); opacity: 1; }
      50%  { top: calc(100% - 6px); opacity: 0; }
      52%  { top: 4px; opacity: 0; }
      54%  { top: 4px; opacity: 1; }
      100% { top: calc(100% - 6px); opacity: 1; }
    }
    #hint {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, calc(-56% + min(16vh, 80px)));
      font-size: 12px; color: rgba(255,255,255,.5);
      white-space: nowrap; pointer-events: none;
    }

    /* ── Result bar ───────────────────────────────────────────────────── */
    #bar {
      background: #0f172a; border-top: 1px solid #1e293b;
      padding: 12px 18px; display: grid;
      grid-template-columns: 10px 1fr; grid-template-rows: auto auto;
      gap: 2px 10px; min-height: 72px; align-items: center; flex-shrink: 0;
    }
    #status-dot {
      grid-row: 1/3; width: 10px; height: 10px; border-radius: 50%;
      background: #dc2626; transition: background .4s;
    }
    #status-dot.ok   { background: #16a34a; }
    #status-dot.warn { background: #ca8a04; }
    #status-dot.send { background: #2563eb; }
    #last-code { font-size: 22px; font-weight: 800; color: #4ade80; word-break: break-all; }
    #last-meta { font-size: 11px; color: #475569; }

    /* ── History Modal & Button ────────────────────────────────────────── */
    #history-modal, #manual-modal {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.98);
      display: flex; flex-direction: column; z-index: 100;
      transition: opacity 0.2s ease, visibility 0.2s;
    }
    #history-modal.hidden, #manual-modal.hidden {
      opacity: 0; pointer-events: none; visibility: hidden;
    }
    
    /* ── Custom Confirm modal ─────────────────────────────────────────── */
    #confirm-modal {
      position: absolute; inset: 0; background: rgba(0, 0, 0, 0.8);
      display: flex; align-items: center; justify-content: center; padding: 20px;
      z-index: 200; transition: opacity 0.2s ease, visibility 0.2s;
    }
    #confirm-modal.hidden {
      opacity: 0; pointer-events: none; visibility: hidden;
    }
    .confirm-content {
      background: #1e293b; border: 1px solid #334155; width: 100%; max-width: 320px;
      border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 20px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
    }
    #confirm-message {
      font-size: 14px; color: #f1f5f9; text-align: center; line-height: 1.5; font-weight: 500;
    }
    .confirm-buttons {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .modal-header {
      padding: 16px; border-bottom: 1px solid #1e293b;
      display: flex; justify-content: space-between; align-items: center;
      background: #0f172a;
    }
    .modal-header h3 { font-size: 16px; font-weight: 600; color: #f1f5f9; }
    .btn-close {
      background: none; border: none; color: #94a3b8; font-size: 28px;
      cursor: pointer; padding: 4px 12px; line-height: 1;
    }
    .modal-body {
      flex: 1; overflow-y: auto; padding: 16px;
    }
    .modal-body.hidden {
      display: none !important;
    }
    #history-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .history-item {
      background: #1e293b; border: 1px solid #334155; padding: 12px;
      border-radius: 6px; display: flex; justify-content: space-between; align-items: center;
      gap: 10px;
    }
    .history-code { font-size: 16px; font-weight: 700; color: #4ade80; word-break: break-all; }
    .history-meta { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .btn-delete-item {
      background: none; border: none; color: #ef4444; font-size: 22px; cursor: pointer; padding: 4px 10px;
      line-height: 1;
    }
    .modal-footer {
      padding: 16px; border-top: 1px solid #1e293b;
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
      background: #0f172a;
    }
    .btn {
      padding: 12px 8px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-danger { background: #3b0712; color: #fca5a5; border: 1px solid #991b1b; }
    .btn-danger:active { background: #4c0519; }
    .btn-primary { background: #1e1b4b; color: #c7d2fe; border: 1px solid #3730a3; }
    .btn-primary:active { background: #312e81; }
    .btn-success { background: #064e3b; color: #a7f3d0; border: 1px solid #065f46; }
    .btn-success:active { background: #065f46; }

    @media (hover: hover) {
      .btn-danger:hover { background: #4c0519; }
      .btn-primary:hover { background: #312e81; }
      .btn-success:hover { background: #065f46; }
    }

    /* Button in the bar */
    #bar {
      background: #0f172a; border-top: 1px solid #1e293b;
      padding: 12px 18px; display: flex; align-items: center;
      gap: 12px; min-height: 72px; flex-shrink: 0;
    }
    #bar-info {
      display: grid;
      grid-template-columns: 10px 1fr; grid-template-rows: auto auto;
      gap: 2px 10px; align-items: center; flex: 1; min-width: 0;
    }
    #history-btn, #manual-btn {
      background: #1e293b; border: 1px solid #334155; color: #f1f5f9;
      padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 6px; height: 38px;
      flex-shrink: 0;
    }
    #history-btn:hover, #manual-btn:hover { background: #334155; }
    #history-badge {
      background: #ef4444; color: white; border-radius: 10px;
      padding: 1px 6px; font-size: 10px; font-weight: bold;
    }

    /* ── Tabs inside Modal ─────────────────────────────────────────── */
    .modal-tabs {
      display: flex; gap: 8px; flex: 1; margin-right: 16px;
    }
    .tab-btn {
      background: none; border: none; color: #64748b; font-size: 15px; font-weight: 600;
      padding: 6px 12px; cursor: pointer; border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab-btn.active {
      color: #4ade80; border-bottom-color: #4ade80;
    }
    
    /* ── Settings Form ─────────────────────────────────────────────── */
    .settings-form {
      display: flex; flex-direction: column; gap: 16px;
    }
    .settings-group {
      display: flex; flex-direction: column; gap: 6px;
    }
    .group-label {
      font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-input, .form-select {
      background: #0f172a; border: 1px solid #334155; border-radius: 6px;
      color: #f1f5f9; padding: 10px 12px; font-size: 14px; outline: none;
      width: 100%; transition: border-color 0.2s;
    }
    .form-input:focus, .form-select:focus {
      border-color: #4ade80;
    }
    .dedup-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    
    /* Formats check list */
    .formats-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: #0f172a; border: 1px solid #334155; border-radius: 6px;
      padding: 12px; max-height: 180px; overflow-y: auto;
    }
    .formats-grid label {
      display: flex; align-items: center; gap: 8px; font-size: 13px;
      color: #cbd5e1; cursor: pointer; user-select: none;
    }
    .formats-grid input[type="checkbox"] {
      accent-color: #4ade80; width: 16px; height: 16px;
    }
  </style>
</head>

      </div>
      
      <div class="settings-group">
        <label class="group-label" data-i18n="labelDedup">Deduplication</label>
        <div class="dedup-row">
          <select id="cfg-dedup-mode" class="form-select">
            <option value="consecutive" data-i18n="optConsecutive">Consecutive</option>

      <div class="settings-group" style="margin-top: 12px;">
        <button id="cfg-reset-btn" class="btn btn-danger" style="width: 100%; background: transparent; border: 1px solid #ef4444; color: #ef4444;" data-i18n="btnReset">Reset to Defaults</button>

    </div>

  <div class="modal-footer" id="modal-history-footer">

    <button id="share-history" class="btn btn-success" data-i18n="btnShare">📤 Share</button>
  </div>
</div>

<!-- ── Custom Confirm Modal ─────────────────────────────────────────── -->

    <div class="confirm-buttons">

    </div>
  </div>
</div>

  </div>
</div>

// ── Custom Async Confirm Dialog Helper ───────────────────────────────
function showConfirm(message, yesLabel, noLabel) {
  return new Promise((resolve) => {
    confirmMessage.textContent = message
    confirmYesBtn.textContent = yesLabel || t.btnValidate || 'OK'
    confirmNoBtn.textContent = noLabel || t.btnCancel || 'Cancel'
    confirmNoBtn.style.display = 'block'
    confirmModal.querySelector('.confirm-buttons').style.gridTemplateColumns = '1fr 1fr'
    
    const onYes = () => {
      cleanup()
      resolve(true)
    }
    const onNo = () => {
      cleanup()
      resolve(false)
    }
    const cleanup = () => {
      confirmYesBtn.removeEventListener('click', onYes)
      confirmNoBtn.removeEventListener('click', onNo)
      confirmModal.classList.add('hidden')
    }
    
    confirmYesBtn.addEventListener('click', onYes)
    confirmNoBtn.addEventListener('click', onNo)
    confirmModal.classList.remove('hidden')
  })
}

function showAlert(message, btnLabel) {
  return new Promise((resolve) => {
    confirmMessage.textContent = message
    confirmYesBtn.textContent = btnLabel || 'OK'
    confirmNoBtn.style.display = 'none'
    confirmModal.querySelector('.confirm-buttons').style.gridTemplateColumns = '1fr'
    
    const onYes = () => {
      confirmYesBtn.removeEventListener('click', onYes)
      confirmModal.classList.add('hidden')
      resolve()
    }
    
    confirmYesBtn.addEventListener('click', onYes)
    confirmModal.classList.remove('hidden')
  })
}

function getHistory() {
  try {
    return JSON.parse(localStorage.getItem('scanned_barcodes')) || []
  } catch {
    return []
  }
}

function escapeHtml(str) {
  if (!str) return ''
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;')
}

function updateHistoryUI() {
  const list = getHistory()
  historyCount.textContent = list.length
  
  if (list.length > 0) {
    historyBadge.textContent = list.length
    historyBadge.style.display = 'inline-block'
    titleInputContainer.style.display = 'block'
  } else {
    historyBadge.style.display = 'none'
    titleInputContainer.style.display = 'none'
  }

  if (list.length === 0) {
    historyList.innerHTML = `<li style="text-align: center; color: #64748b; padding: 24px; font-size: 14px;">${t.noBarcodes}</li>`
    return
  }

  historyList.innerHTML = list.map((item, index) => {
    const time = new Date(item.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
    return `
      <li class="history-item">
        <div>
          <div class="history-code">${escapeHtml(item.code)}</div>
          <div class="history-meta">${escapeHtml(item.type)} · ${time}</div>
        </div>
        <button class="btn-delete-item" data-index="${index}" title="${t.deleteTitle}">&times;</button>
      </li>
    `
  }).join('')
}

function saveBarcodeToHistory(code, type) {
  const list = getHistory()
  list.unshift({
    code,
    type: fmtType(type),
    timestamp: Date.now()
  })
  localStorage.setItem('scanned_barcodes', JSON.stringify(list))
  updateHistoryUI()
}

const zbarCanvas = document.createElement('canvas')

// ── Coordinate helpers ────────────────────────────────────────────────────────
function coverTransform() {
  const vw = video.videoWidth, vh = video.videoHeight
  const cw = wrap.clientWidth, ch = wrap.clientHeight
  const scale = Math.max(cw / vw, ch / vh)
  return { scale, offsetX: (cw - vw * scale) / 2, offsetY: (ch - vh * scale) / 2 }
}
function videoToDisplay(x, y, t) { return { x: x * t.scale + t.offsetX, y: y * t.scale + t.offsetY } }
function viewfinderInVideo(t) {
  const vfRect = vfEl.getBoundingClientRect(), wrapRect = wrap.getBoundingClientRect()
  const dx = vfRect.left - wrapRect.left, dy = vfRect.top - wrapRect.top
  return {
    x: Math.max(0, Math.round((dx - t.offsetX) / t.scale)),
    y: Math.max(0, Math.round((dy - t.offsetY) / t.scale)),
    w: Math.round(vfRect.width / t.scale),
    h: Math.round(vfRect.height / t.scale),
  }
}

// ── Draw bounding box ────────────────────────────────────────────────────────
function drawBox(pts, label, alpha) {
  if (!pts?.length) return
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y)
  const xMin = Math.min(...xs), xMax = Math.max(...xs)
  const yMin = Math.min(...ys), yMax = Math.max(...ys)
  const PAD = pts.length < 4 ? 10 : 0
  const rect = [
    { x: xMin-PAD, y: yMin-PAD }, { x: xMax+PAD, y: yMin-PAD },
    { x: xMax+PAD, y: yMax+PAD }, { x: xMin-PAD, y: yMax+PAD },
  ]
  ctx.save(); ctx.globalAlpha = alpha
  ctx.beginPath()
  rect.forEach(({x, y}, i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))
  ctx.closePath()
  ctx.fillStyle = 'rgba(74,222,128,0.18)'; ctx.fill()
  ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke()
  if (label) {
    ctx.font = 'bold 13px system-ui'
    const tw = ctx.measureText(label).width
    const lx = rect[0].x, ly = rect[0].y - 6
    ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.beginPath()
    ctx.roundRect(lx-2, ly-18, tw+12, 22, 4); ctx.fill()
    ctx.fillStyle = '#4ade80'; ctx.fillText(label, lx+4, ly-2)
  }
  ctx.restore()
}

// ── Fade system ───────────────────────────────────────────────────────────────
let pending = [], fadeAlpha = 0, fadeTimer = null
function startFade() {
  clearTimeout(fadeTimer); fadeAlpha = 1
  const step = () => {
    if (fadeAlpha <= 0) { pending = []; return }
    fadeAlpha = Math.max(0, fadeAlpha - 0.05); redraw()
    fadeTimer = setTimeout(step, 60)
  }
  fadeTimer = setTimeout(step, 500)
}
function redraw() {
  overlay.width = wrap.clientWidth; overlay.height = wrap.clientHeight
  pending.forEach(s => drawBox(s.pts, s.label, fadeAlpha))
}

// ── Send via iroh ─────────────────────────────────────────────────────────────
let sending = false
async function sendBarcode(code) {
  if (!node || !pcEndpoint || sending) return
  sending = true
  irohDot.className = 'sending'; irohStatus.textContent = 'Sending…'
  try {
    const stream = node.connect(pcEndpoint, code)
    for await (const event of stream) {
      if (event.type === 'closed') break
    }
    irohDot.className = 'ready'; irohStatus.textContent = '✓ ' + code
    setStatus('ok', 'Sent to PC')
  } catch (err) {
    irohDot.className = 'error'; irohStatus.textContent = 'Error: ' + err.message
    setStatus('warn', 'Failed to send to PC')
    setTimeout(() => { irohDot.className = 'ready'; irohStatus.textContent = 'Ready' }, 3000)
  }
  sending = false
}

// ── Scan loop ─────────────────────────────────────────────────────────────────
let prevCode = '', prevAt = 0, scanning = false
const dedupSeen = new Set()

function applyTransform(code) {
  switch (cfg.transform) {
    case 'upper': return code.toUpperCase()
    case 'lower': return code.toLowerCase()
    case 'trim':  return code.trim()
    default:      return code
  }
}

function matchesIgnore(code) {
  if (!cfg.ignore_pattern) return false
  try { return new RegExp(cfg.ignore_pattern).test(code) } catch { return false }
}

function isDup(code) {
  if (cfg.dedup_mode === 'off') return false
  const now = Date.now()
  if (cfg.dedup_mode === 'consecutive') {
    return code === prevCode && now - prevAt < cfg.dedup_secs * 1000
  }
  if (cfg.dedup_mode === 'any') {
    return dedupSeen.has(code)
  }
  return false
}

function recordSeen(code) {
  prevCode = code
  prevAt = Date.now()
  dedupSeen.add(code)
}

async function tick() {
  if (!scanner) {
    requestAnimationFrame(tick)
    return
  }
  if (!scanning && video.readyState === HTMLMediaElement.HAVE_ENOUGH_DATA) {
    scanning = true
    zbarCanvas.width = video.videoWidth; zbarCanvas.height = video.videoHeight
    zbarCtx.drawImage(video, 0, 0)

    const t = coverTransform(), vfV = viewfinderInVideo(t)
    vfV.w = Math.min(vfV.w, zbarCanvas.width  - vfV.x)
    vfV.h = Math.min(vfV.h, zbarCanvas.height - vfV.y)

    if (vfV.w > 10 && vfV.h > 10) {
      const imgData = zbarCtx.getImageData(vfV.x, vfV.y, vfV.w, vfV.h)
      const symbols = await zbarWasm.scanImageData(imgData, scanner)

      if (symbols.length > 0) {
        pending = symbols.map(sym => ({
          pts:   sym.points.map(p => videoToDisplay(p.x + vfV.x, p.y + vfV.y, t)),
          label: `${sym.decode()}  [${fmtType(sym.typeName)}]`
        }))
        fadeAlpha = 1; clearTimeout(fadeTimer); redraw(); startFade()
        vfEl.classList.add('found')

        // Pick the barcode with the largest bounding box (avoids partial adjacent barcodes)
        const symArea = sym => {
          const xs = sym.points.map(p => p.x), ys = sym.points.map(p => p.y)
          return (Math.max(...xs) - Math.min(...xs)) * (Math.max(...ys) - Math.min(...ys))
        }
        const sym = symbols.reduce((best, s) => symArea(s) > symArea(best) ? s : best)
        {
          const rawCode = sym.decode()
          if (localMode) {
            // Local mode: apply local prefix, transform, and advanced deduplication/ignore regex
            if (!isDup(rawCode) && !matchesIgnore(rawCode)) {
              recordSeen(rawCode)

              const finalCode = cfg.prefix + applyTransform(rawCode)

              lastCode.textContent = finalCode
              lastMeta.textContent = `${fmtType(sym.typeName)}  ·  ${new Date().toLocaleTimeString()}`
              
              // Save to localStorage history
              saveBarcodeToHistory(finalCode, sym.typeName)
              
              if (tapped) navigator.vibrate?.(55)
              setStatus('ok', t.recordedLocally)
            }
          } else {
            // Connected mode: settings are configured on the PC receiver.
            // Use a standard 5-second consecutive deduplication to prevent connection spam,
            // and send the RAW code to the PC so the receiver processes it exactly once.
            const now = Date.now()
            if (!(rawCode === prevCode && now - prevAt < 5000)) {
              prevCode = rawCode; prevAt = now

              lastCode.textContent = rawCode
              lastMeta.textContent = `${fmtType(sym.typeName)}  ·  ${new Date().toLocaleTimeString()}`
              
              // Save raw Copy to local backup history so no data is ever lost
              saveBarcodeToHistory(rawCode, sym.typeName)
              
              if (tapped) navigator.vibrate?.(55)
              setStatus('send', t.sendingToPc)
              sendBarcode(rawCode)
            }
          }
        }
      } else {
        vfEl.classList.remove('found')
      }
    }
    scanning = false
  }
  requestAnimationFrame(tick)
}

requestAnimationFrame(tick)
new ResizeObserver(redraw).observe(wrap)
</script>
</body>
</html>
